<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09090B"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="line" x1="180" y1="0" x2="1020" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientTransform="translate(855 124) rotate(90) scale(170)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="855" cy="124" r="150" fill="url(#orb)" filter="url(#blur)">
    <animate attributeName="cx" values="855;900;855" dur="8s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.22" stroke="#94A3B8">
    <path d="M0 72H1200M0 144H1200M0 216H1200M0 288H1200"/>
    <path d="M120 0V360M240 0V360M360 0V360M480 0V360M600 0V360M720 0V360M840 0V360M960 0V360M1080 0V360"/>
  </g>

  <path d="M100 276C214 245 280 301 386 270C480 243 527 190 622 212C719 235 772 283 865 250C947 221 987 172 1100 185" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 10">
    <animate attributeName="stroke-dashoffset" values="0;-72" dur="5s" repeatCount="indefinite"/>
  </path>

  <g fill="#E2E8F0">
    <circle cx="386" cy="270" r="4"><animate attributeName="r" values="4;7;4" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="622" cy="212" r="4"><animate attributeName="r" values="4;7;4" dur="3.2s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle cx="865" cy="250" r="4"><animate attributeName="r" values="4;7;4" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <text x="88" y="126" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="-1">Mrudula</text>
  <text x="91" y="169" fill="#A5B4FC" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">research · systems · experiments</text>
  <text x="91" y="213" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">I like questions that refuse to stay inside the notebook.</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#64748B">
    <text x="950" y="65">01 / observe</text>
    <text x="950" y="86">02 / build</text>
    <text x="950" y="107">03 / test</text>
    <text x="950" y="128">04 / rewrite</text>
  </g>
</svg>