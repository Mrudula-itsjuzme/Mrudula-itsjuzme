name: Update contribution graph
on:
  workflow_dispatch:
  schedule:
    - cron: "22 3 * * *"
  push:
    paths:
      - ".github/workflows/contribution-graph.yml"
      - "scripts/update_contribution_graph.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate contribution graph
        run: python3 scripts/update_contribution_graph.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update contribution graph"
            git push
          fi
